name: Tests

on: pull_request

permissions:
  contents: read

jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: runsplice --help
      - run: agentdbg --help
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/response_diff.test.mjs tests/inspection.test.mjs
